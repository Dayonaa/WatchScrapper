[project]
name = "watch-scrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dayonaa", email = "arifadayona@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tqdm>=4.70.0",
]

[project.scripts]
watch-scrapper = "watch_scrapper:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
